server:
  port: ${SEARCH_SERVICE_PORT:5010}
  forward-headers-strategy: framework
spring:
  application:
    name: search-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always