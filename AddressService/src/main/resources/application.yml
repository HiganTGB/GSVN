spring:
  application:
    name: address-service
  profiles:
    active : local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: always
      platform: sqlite
  jmx:
    enabled: false
mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.gsvn.addressservice.model.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
