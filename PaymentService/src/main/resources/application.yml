server:
  port: ${PAYMENT_SERVICE_PORT:5014}
  forward-headers-strategy: framework
spring:
  application:
    name: payment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.gsvn.productservice.model.entity
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  use-management-port: false