spring:
  security:
    user:
      name: ${SHIPMENT_SERVICE_USER:abc1234}
      password: ${SHIPMENT_SERVICE_PASSWORD:abc1234}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:gsvn_dev}?currentSchema=${SHIPMENT_DB_SCHEMA:shipping_db}
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${SHIPMENT_REDIS_DATABASE:6}
      username: default
      password: ${REDIS_PASSWORD:admin1234}
  cloud:
    consul:
      host: ${CONSUL_HOST:consul-server-1}
      port: ${CONSUL_PORT:8500}
      discovery:
        service-name: shipment-service
        instance-id: ${spring.application.name}:${server.port}
        prefer-ip-address: false
        heartbeat:
          enabled: true
          ttl: 300s
        health-check-critical-timeout: 12m
jwt:
  signerKey: ${JWT_SIGNER_KEY:5661608670d8591f4a9b407b975e1195d5204481358997c4e512803b87944062}
app:
  security:
    internal-api-key: ${INTERNAL_API_KEY:gsvn}
encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:5661608670d8591f4a9b407b975e1195d5204481358997c4e512803b87944062}
  salt: ${ENCRYPTION_SALT:12345678}