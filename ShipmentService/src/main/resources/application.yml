server:
  port: ${SHIPMENT_SERVICE_PORT:5009}
spring:
  application:
    name: shipment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.gsvn.shipmentservice.model.entity
  type-handlers-package: com.gsvn.shipmentservice.config
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler