<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: A4; margin: 1.5cm; }
        body { font-family: 'Times New Roman', serif; line-height: 1.4; }
        .title { text-align: center; font-size: 20pt; font-weight: bold; text-transform: uppercase; }
        .main-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .main-table th, .main-table td { border: 1px solid black; padding: 8px; text-align: center; }
        .text-left { text-align: left; }
        .signature-box { float: right; width: 250px; text-align: center; margin-top: 40px; }
    </style>
</head>
<body>
<div class="title">PHIẾU XUẤT KHO</div>
<p class="text-center italic">Ngày tạo: <span th:text="${#temporals.format(outbound.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>

<table style="width: 100%">
    <tr>
        <td><strong>Mã phiếu:</strong> <span th:text="${outbound.receiptCode}"></span></td>
        <td><strong>Kho xuất:</strong> <span th:text="${warehouseName}"></span></td>
    </tr>
    <tr>
        <td><strong>Loại xuất:</strong> <span th:text="${outbound.type}"></span></td>
        <td><strong>Mã đơn hàng (External):</strong> <span th:text="${outbound.externalId}"></span></td>
    </tr>
</table>

<table class="main-table">
    <thead>
    <tr>
        <th>STT</th>
        <th>Mã SKU</th>
        <th>Tên sản phẩm</th>
        <th>Số lượng</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item, stat : ${outbound.items}">
        <td th:text="${stat.count}"></td>
        <td th:text="${item.skuCode}"></td>
        <td class="text-left" th:text="${item.productName}"></td>
        <td th:text="${item.quantity}"></td>
    </tr>
    </tbody>
</table>

<div class="signature-box">
    <p>Ngày .... tháng .... năm 20....</p>
    <strong>Người lập phiếu</strong><br/>
    (Ký, họ tên)
    <div style="height: 80px;"></div>
    <strong th:text="${staffName}"></strong>
</div>
</body>
</html>
