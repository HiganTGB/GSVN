spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: customer-service
server:
  port: ${CUSTOMER_SERVICE_PORT:5004}
  forward-headers-strategy: framework
mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.gsvn.customerservice.model.entity
  configuration:
    map-underscore-to-camel-case: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  use-management-port: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always