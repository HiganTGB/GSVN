
spring:
  security:
    user:
      name: abc1234
      password: abc1234
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
        acknowledge-mode: auto
eureka:
  client:
    service-url:
      defaultZone: http://abc1234:abc1234@eureka:8761/eureka/
