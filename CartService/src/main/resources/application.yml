server:
  port: ${CART_SERVICE_PORT:5012}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: cart-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.gsvn.cartservice.model.entity
  configuration:
    map-underscore-to-camel-case: true