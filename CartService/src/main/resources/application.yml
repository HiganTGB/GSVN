server:
  port: ${CART_SERVICE_PORT:5012}
  forward-headers-strategy: framework
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: cart-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  use-management-port: false

mybatis:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.gsvn.cartservice.model.entity
  configuration:
    map-underscore-to-camel-case: true