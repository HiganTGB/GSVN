           { name: 'Customer Service', url: 'http://${SWAGGER_BASE_HOST:-localhost}:${CUSTOMER_SERVICE_PORT}/v3/api-docs' },
           { name: 'Product Service', url: 'http://${SWAGGER_BASE_HOST:-localhost}:${PRODUCT_SERVICE_PORT}/v3/api-docs' },
           { name: 'Inventory Service', url: 'http://${SWAGGER_BASE_HOST:-localhost}:${INVENTORY_SERVICE_PORT}/v3/api-docs' },
           { name: 'Order Service', url: 'http://${SWAGGER_BASE_HOST:-localhost}:${ORDER_SERVICE_PORT}/v3/api-docs' },
           { name: 'Cart Service', url: 'http://${SWAGGER_BASE_HOST:-localhost}:${CART_SERVICE_PORT}/v3/api-docs' },
