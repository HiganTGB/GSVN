      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - S3_TEMP_BUCKET_NAME=${S3_TEMP_BUCKET_NAME}
      - S3_EXTERNAL_URL=${S3_EXTERNAL_URL}
      - MEDIA_SERVICE_USER=${MEDIA_SERVICE_USER}
      - MEDIA_SERVICE_PASSWORD=${MEDIA_SERVICE_PASSWORD}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}

      - CONSUL_HOST=${CONSUL_HOST}
      - CONSUL_PORT=${CONSUL_PORT}
    deploy:
      resources:
        limits:
          memory: 256M
  customer-service:
    build:
      context: ../CustomerService
      dockerfile: Dockerfile
    container_name: gsvn-customer-service
    ports:
      - "${CUSTOMER_SERVICE_PORT}:5004"
    networks:
