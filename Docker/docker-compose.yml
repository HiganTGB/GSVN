      - HRM_SERVICE_PASSWORD=${HRM_SERVICE_PASSWORD}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
  product-service:
    build:
      context: ../ProductService
      dockerfile: Dockerfile
    container_name: gsvn-product-service
    ports:
      - "${PRODUCT_SERVICE_PORT}:5006"
    networks:
