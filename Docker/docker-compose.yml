      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${ADDRESS_DB_DRIVER}
      - SPRING_CLOUD_CONSUL_HOST=${CONSUL_HOST}
      - SPRING_CLOUD_CONSUL_PORT=${CONSUL_PORT}
      - SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME=${ADDRESS_SERVICE_NAME}
    deploy:
      resources:
        limits:
          memory: 256M
  media-service:
