      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SEARCH_REDIS_DATABASE=${SEARCH_REDIS_DATABASE}

      - SEARCH_SERVICE_USER=${SEARCH_SERVICE_USER}
      - SEARCH_SERVICE_PASSWORD=${SEARCH_SERVICE_PASSWORD}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CONSUL_HOST=${CONSUL_HOST}
      - CONSUL_PORT=${CONSUL_PORT}
  order-service:
    build:
      context: ../OrderService
      dockerfile: Dockerfile
    container_name: gsvn-order-service
    ports:
      - "${ORDER_SERVICE_PORT}:5013"
    networks:
      - gsvn_network
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ORDER_SERVICE_PORT=${ORDER_SERVICE_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - ORDER_DB_SCHEMA=${ORDER_DB_SCHEMA}
      - REDIS_HOST=${REDIS_HOST}
      - ORDER_REDIS_DATABASE=${ORDER_REDIS_DATABASE}
      - SPRING_RABBITMQ_HOST=${RABBITMQ_HOST}
      - SPRING_RABBITMQ_PORT=${RABBITMQ_PORT}
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - SPRING_RABBITMQ_VIRTUAL_HOST=${RABBITMQ_VHOST}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - APP_ORDER_TIME_OUT=${ORDER_TIMEOUT}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CONSUL_HOST=${CONSUL_HOST}
      - CONSUL_PORT=${CONSUL_PORT}
    depends_on:
      consul-server-1:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  notification-service:
    build:
      context: ../NotificationService
