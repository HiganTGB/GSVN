version: '3.8'
services:
  kong-database:
    image: postgres:9.6
    container_name: kong-database
    environment:
      POSTGRES_USER: ${KONG_PG_USER}
      POSTGRES_DB: ${KONG_PG_DB}
      POSTGRES_PASSWORD: ${KONG_PG_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - "db-data-kong-postgres:/var/lib/postgresql/data"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${KONG_PG_USER}" ]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - gsvn_network
  kong-migrations:
    image: kong:2.8.1-alpine
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
      KONG_PG_DATABASE: ${KONG_PG_DB}
    command: kong migrations bootstrap
    restart: on-failure
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - gsvn_network
  kong:
    image: kong:2.8.1-alpine
    container_name: kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: ${KONG_PG_USER}
      KONG_PG_PASSWORD: ${KONG_PG_PASSWORD}
      KONG_PG_DATABASE: ${KONG_PG_DB}
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
    restart: on-failure
    ports:
      - "8000:8000"  # Proxy HTTP
      - "8443:8443"  # Proxy HTTPS
      - "8001:8001"  # Admin API HTTP
      - "8444:8444"  # Admin API HTTPS
    depends_on:
      - kong-migrations
    networks:
      - gsvn_network
  konga-db:
    image: postgres:9.6
    container_name: konga-db
    environment:
      POSTGRES_USER: ${KONGA_DB_USER}
      POSTGRES_DB: ${KONGA_DB_NAME}
      POSTGRES_PASSWORD: ${KONGA_DB_PASSWORD}
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${KONGA_DB_USER}" ]
      interval: 5s
      timeout: 10s
      retries: 10
  konga-prepare:
    image: pantsel/konga
    command: "-c prepare -a postgres -u postgresql://${KONGA_DB_USER}:${KONGA_DB_PASSWORD}@konga-db:5432/${KONGA_DB_NAME}"
    restart: on-failure
    depends_on:
      konga-db:
        condition: service_healthy
  konga:
    image: pantsel/konga
    ports:
      - "1337:1337"
    container_name: konga
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_ADAPTER: postgres
      DB_HOST: konga-db
      DB_USER: ${KONGA_DB_USER}
      DB_PASSWORD: ${KONGA_DB_PASSWORD}
      DB_DATABASE: ${KONGA_DB_NAME}
      TOKEN_SECRET: ${KONGA_TOKEN_SECRET}
      KONG_URL: http://kong:8001
    depends_on:
      konga-prepare:
        condition: service_completed_successfully
      kong:
        condition: service_started
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z-cpuv1
    container_name: gsvn_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: gsvn
      MINIO_ROOT_PASSWORD: admin123456
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - gsvn_network
  redis:
    image: redis:8.0
    container_name: gsvn_redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-123456}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - gsvn_network
  postgres:
    image: postgres:15-alpine
    image: postgres:18-alpine
    user: root
    container_name: gsvn_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
     - ./init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
      -c wal_buffers=4MB
      -c min_wal_size=80MB
      -c max_wal_size=1GB
      -c max_stack_depth=2MB
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 60s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
            memory: 256M
    networks:
      - gsvn_network
  eureka:
    build:
      context: ../EurekaServer
      dockerfile: Dockerfile
    container_name: ${EUREKA_CONTAINER_NAME}
  rabbitmq:
    image: rabbitmq:3-management
    container_name: 'rabbitmq'
    ports:
      - "${EUREKA_PORT}:${EUREKA_PORT}"
    env_file:
      - .env
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
      - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    environment:
      - SERVER_PORT=${EUREKA_PORT}
      - SPRING_SECURITY_USER_NAME=${EUREKA_USER}
      - SPRING_SECURITY_USER_PASSWORD=${EUREKA_PASSWORD}
      RABBITMQ_DEFAULT_USER: rootadmin
      RABBITMQ_DEFAULT_PASS: rootadmin
    networks:
      - gsvn_network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity" ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s
  consul-server-1:
    image: hashicorp/consul:1.22
    container_name: gsvn-consul-1
    #restart: always
    command: "agent -server -bootstrap-expect=3 -node=server-1 -ui -client=0.0.0.0 -disable-host-node-id -log-level=err"
    volumes:
      - consul_data_1:/consul/data
    ports:
      - "8500:8500"
    deploy:
      resources:
        limits:
          memory: 80MB
          memory: 128MB
    networks:
      gsvn_network:
        ipv4_address: 172.19.0.10
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8500/v1/status/leader" ]
      interval: 10s
      timeout: 5s
      retries: 5

  consul-server-2:
    image: hashicorp/consul:1.22
    container_name: gsvn-consul-2
    #restart: always
    command: "agent -server -retry-join=consul-server-1 -node=server-2 -client=0.0.0.0 -disable-host-node-id -log-level=err"
    volumes:
      - consul_data_2:/consul/data
    deploy:
      resources:
        limits:
          memory: 128MB
    networks:
      gsvn_network:
        ipv4_address: 172.19.0.11
    healthcheck:
      test: [ "CMD", "consul", "members", "-status=alive" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  consul-server-3:
    image: hashicorp/consul:1.22
    container_name: gsvn-consul-3
    #restart: always
    command: "agent -server -retry-join=consul-server-1 -node=server-3 -client=0.0.0.0 -disable-host-node-id -log-level=err"
    volumes:
      - consul_data_3:/consul/data
    deploy:
      resources:
        limits:
          memory: 128MB
    networks:
      gsvn_network:
        ipv4_address: 172.19.0.12
    healthcheck:
      test: [ "CMD", "consul", "members", "-status=alive" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  auth-service:
    build:
      context: ../AuthService
      dockerfile: Dockerfile
    container_name: gsvn-auth-service
    ports:
      - "${AUTH_SERVICE_PORT}:5001"
    networks:
      - gsvn_network
    depends_on:
      consul-server-1:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod

      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT}
      - SPRING_APPLICATION_NAME=auth-service

      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_DB=${POSTGRES_DB}
      - AUTH_DB_SCHEMA=${AUTH_DB_SCHEMA}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      #      - AUTH_REDIS_DB=${AUTH_REDIS_DB}
      - CONSUL_HOST=${CONSUL_HOST}
      - CONSUL_PORT=${CONSUL_PORT}
      - JWT_SIGNER_KEY=${JWT_SIGNER_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    deploy:
      resources:
        limits:
          memory: 512M
  address-service:
    build:
      context: ../AddressService
      dockerfile: Dockerfile
    container_name: gsvn-address-service
    ports:
      - "5005:5005"
      - "${ADDRESS_SERVICE_PORT:-5005}:5005"
    networks:
      - gsvn_network
    depends_on:
