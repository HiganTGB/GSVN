           { name: 'Shipment Service', url: 'http://${SWAGGER_BASE_HOST:-localhost}:${SHIPMENT_SERVICE_PORT}/v3/api-docs' },
           { name: 'Promotion Service', url: 'http://${SWAGGER_BASE_HOST:-localhost}:${PROMOTION_SERVICE_PORT}/v3/api-docs' },
