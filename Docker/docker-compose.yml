version: '3.8'
services:
  redis:
    image: redis:8.0
    container_name: gsvn_redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-123456}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - gsvn_network
  postgres:
    image: postgres:15-alpine
    container_name: gsvn_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 60s
      timeout: 5s
      retries: 5
    networks:
      - gsvn_network
  eureka:
    build:
      context: ../EurekaServer
      dockerfile: Dockerfile
    container_name: ${EUREKA_CONTAINER_NAME}
    ports:
      - "${EUREKA_PORT}:${EUREKA_PORT}"
    env_file:
      - .env
    environment:
      - SERVER_PORT=${EUREKA_PORT}
      - SPRING_SECURITY_USER_NAME=${EUREKA_USER}
      - SPRING_SECURITY_USER_PASSWORD=${EUREKA_PASSWORD}
    networks:
      - gsvn_network
  postgres_data: {}
  redis_data: {}
networks:
  gsvn_network:
    driver: bridge